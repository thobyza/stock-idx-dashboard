<div class="min-h-screen bg-olive-100 p-3 flex flex-col gap-4 font-sans"><!-- bg-[#F3F5ED] -->
  <!-- Header -->
  <!-- <app-index-header></app-index-header> -->

  <div class="flex gap-2 grow flex-col lg:flex-row">

    <!-- Sidebar -->
    <aside [class]="'shrink-0 flex flex-col gap-5 p-1.5 transition-all duration-300 ' + (sidebarCollapsed() ? '' : 'w-full lg:w-60')">
      <app-sector-sidebar
        [ihsg]="ihsg()"
        [advancing]="marketStats().advancing"
        [unchanged]="marketStats().unchanged"
        [declining]="marketStats().declining"
        [total]="marketStats().total"
        [selectedDate]="selectedDate()"
        [collapsed]="sidebarCollapsed()"
        (toggleCollapse)="toggleSidebar()"
        [activePage]="activePage()"
        (pageSelected)="selectPage($event)"
      ></app-sector-sidebar>
    </aside>

    <!-- Center Board Grid & Lists -->
    @if (activePage() === 'dashboard') {
      <app-heatmap-board
        class="flex-auto"
        [searchQuery]="searchQuery()"
        (searchQueryChange)="searchQuery.set($event)"
        [selectedDate]="selectedDate()"
        (dateChange)="onDateSelect($event)"
        [viewMode]="viewMode()"
        (viewModeChange)="setViewMode($event)"
        [sortBy]="sortBy()"
        (sortByChange)="setSortBy($event)"
        [filteredStocks]="filteredStocks()"
        [sectorPerformances]="sectorPerformances()"
        [selectedIndex]="selectedIndex()"
        (indexSelected)="selectIndex($event)"
        [selectedSector]="selectedSector()"
        (sectorSelected)="selectSector($event)"
      ></app-heatmap-board>
    }
    @if (activePage() === 'movers') {
      <app-market-movers class="flex-auto" [stocks]="stocks()"></app-market-movers>
    }
    @if (activePage() === 'news') {
      <app-market-news class="flex-auto"></app-market-news>
    }
    @if (activePage() === 'calendar') {
      <app-corporate-actions class="flex-auto"></app-corporate-actions>
    }

  </div>
</div>
