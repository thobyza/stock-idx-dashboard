<div class="grid grid-cols-5 sm:grid-cols-6 md:grid-cols-8 xl:grid-cols-10 gap-0.5 flex-grow auto-rows-fr">                                                                                      
  @for (stock of stocks(); track stock.symbol) {                                                                                                                                                               
    <button                                                                                                                                                                                                    
      class="rounded-xs p-1 text-center transition-colors duration-500 flex flex-col 
        justify-center items-center gap-1 cursor-pointer aspect-square outline-none active:scale-95"                                                                                                                                                                                          
      [style]="getHeatStyle(stock.change)"                                                                                                                                                                     
      (click)="onSelectStock(stock.symbol)"                                                                                                                                                                    
    >                                                                                                                                                                                                          
      <span class="text-[14px] font-bold tracking-wide uppercase">{{ stock.symbol }}</span>                                                                                                      
      <span class="text-[11px] font-mono ">{{ stock.price | number }}</span>                                                                                                                      
      <span class="text-[12px] font-mono font-semibold">                                                                                                                                            
        {{ stock.change >= 0 ? '+' : '' }}{{ stock.change | number:'1.2-2' }}%                                                                                                                                 
      </span>                                                                                                                                                                                                  
    </button>                                                                                                                                                                                                  
  }                                                                                                                                                                                                            
</div>
