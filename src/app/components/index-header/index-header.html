<header class="flex justify-between items-center flex-wrap gap-4 pb-4 border-b border-slate-800">                                                                                  
  <div class="flex items-center gap-6">                                                                                                                                 
    <h1 class="text-2xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500 font-display">                                     
      IDX Stock Heatmap
    </h1>                                                                                
    <!-- <p class="text-xs text-slate-400">Indonesian Stock Market Heatmap Dashboard</p>       -->                                                                       
  </div>                                                                                   
                                                                                            
  <!-- Index Health Metrics -->                                                            
  <div class="flex items-center gap-6 flex-wrap">                                          
    <div class="flex flex-col">                                                            
      <span class="text-[10px] text-slate-500 uppercase tracking-wider">Index Breadth (Adv / Flat / Dec)</span>                                                                         
      <div class="flex items-center gap-2 mt-1">                                           
        <div class="flex w-36 h-2 rounded overflow-hidden bg-slate-800">                   
          <div class="bg-emerald-500 h-full" [style.width.%]="(advancing() / total()) * 100"></div>                                                                                  
          <div class="bg-slate-400 h-full" [style.width.%]="(unchanged() / total()) * 100"></div>                                                                                  
          <div class="bg-rose-500 h-full" [style.width.%]="(declining() / total()) * 100"></div>                                                                                  
        </div>                                                                             
        <span class="text-xs font-semibold font-mono">                                     
          <span class="text-emerald-400">{{ advancing() }}</span>/{{ unchanged() }}/<span class="text-rose-400">{{ declining() }}</span>                                               
        </span>                                                                            
      </div>                                                                               
    </div>                                                                                 
                                                                                            
    <!-- <div class="bg-slate-900/40 px-3 py-1.5 rounded border border-slate-900 flex flex-col">
      <span class="text-[10px] text-slate-500 uppercase tracking-wider">Connection Status</span>                                                                                
      <div class="flex items-center gap-1.5 mt-0.5">                                       
        <div class="w-2 h-2 rounded-full font-bold" [class.bg-emerald-400]="isLive()" [class.bg-rose-500]="!isLive()" [class.animate-pulse]="isLive()"></div>                      
        <span class="text-xs font-mono font-medium text-slate-300">{{ isLive() ? 'LIVE STREAM' : 'DISCONNECTED' }}</span>                                                           
      </div>                                                                               
    </div>                                                                                  -->
  </div>                                                                                   
</header>
